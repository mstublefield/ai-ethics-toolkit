[project]
name = "ai-ethics-toolkit"
version = "0.1.0"
description = "Local CLI + Claude Code skill for AI ethics review, bias checks, and policy drafting. Does mechanical work locally; Claude does judgment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matthew Stublefield", email = "matthew@fieldway.org" },
]
keywords = ["ai-ethics", "fairness", "claude-code", "responsible-ai", "bias-detection"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
fairness = [
    "fairlearn>=0.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ethics = "ethics_toolkit.cli:app"

[project.urls]
Homepage = "https://github.com/mstublefield/ai-ethics-toolkit"
Issues = "https://github.com/mstublefield/ai-ethics-toolkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethics_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"src/ethics_toolkit/templates" = "ethics_toolkit/templates"
"src/ethics_toolkit/data" = "ethics_toolkit/data"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
